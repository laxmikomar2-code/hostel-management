<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            height: 70px;
            background: linear-gradient(135deg, #07111f, #163d59);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #555;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #0072ff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005dcc;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h1>🏠 Hostel Management System</h1>

        <a href="{{ url_for('students') }}"
           class="back">
            ← Students
        </a>

    </div>


    <div class="container">

        <div class="box">

            <h2>✏️ Edit Student</h2>

            <form method="POST">

                <label>Student Name</label>

                <input type="text"
                       name="name"
                       value="{{ student.name }}"
                       required>


                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ student.email }}"
                       required>


                <label>Phone</label>

                <input type="text"
                       name="phone"
                       value="{{ student.phone }}"
                       required>


                <label>Course</label>

                <input type="text"
                       name="course"
                       value="{{ student.course }}"
                       required>


                <button type="submit">
                    💾 Update Student
                </button>

            </form>

        </div>

    </div>

</body>

</html>
