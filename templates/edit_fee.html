```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Fee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            height: 70px;
            background: linear-gradient(135deg, #07111f, #163d59);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .back {
            text-decoration: none;
            color: white;
            background: #555;

            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            padding: 35px;
        }

        .box {
            max-width: 700px;
            margin: auto;

            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;
        }

        button {
            margin-top: 25px;

            padding: 12px 25px;

            border: none;

            border-radius: 7px;

            background: #0072ff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #005dcc;
        }

    </style>

</head>


<body>


<div class="navbar">

    <h1>
        🏠 Hostel Management System
    </h1>

    <a href="{{ url_for('fees') }}"
       class="back">

        ← Fees

    </a>

</div>


<div class="container">


    <div class="box">

        <h2>
            ✏️ Edit Fee
        </h2>


        <form method="POST">


            <label>
                Student
            </label>

            <select name="student_id" required>

                {% for student in students %}

                <option
                    value="{{ student.student_id }}"
                    {% if student.student_id == fee.student_id %}
                    selected
                    {% endif %}
                >

                    {{ student.name }}

                </option>

                {% endfor %}

            </select>


            <label>
                Amount
            </label>

            <input
                type="number"
                name="amount"
                step="0.01"
                value="{{ fee.amount }}"
                required
            >


            <label>
                Fee Type
            </label>

            <select name="fee_type" required>

                <option
                    value="Hostel Fee"
                    {% if fee.fee_type == "Hostel Fee" %}
                    selected
                    {% endif %}
                >
                    Hostel Fee
                </option>

                <option
                    value="Mess Fee"
                    {% if fee.fee_type == "Mess Fee" %}
                    selected
                    {% endif %}
                >
                    Mess Fee
                </option>

                <option
                    value="Other"
                    {% if fee.fee_type == "Other" %}
                    selected
                    {% endif %}
                >
                    Other
                </option>

            </select>


            <label>
                Payment Date
            </label>

            <input
                type="date"
                name="payment_date"
                value="{{ fee.payment_date }}"
                required
            >


            <label>
                Status
            </label>

            <select name="status">

                <option
                    value="Paid"
                    {% if fee.status == "Paid" %}
                    selected
                    {% endif %}
                >
                    Paid
                </option>

                <option
                    value="Pending"
                    {% if fee.status == "Pending" %}
                    selected
                    {% endif %}
                >
                    Pending
                </option>

            </select>


            <button type="submit">
                Update Fee
            </button>


        </form>

    </div>


</div>


</body>

</html>
```
